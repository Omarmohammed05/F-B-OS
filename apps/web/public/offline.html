<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#17130f" />
    <title>Sufra OS — لا اتصال</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f5f5f7;
        --surface: #ffffff;
        --ink: #1d1d1f;
        --ink-2: #6e6e73;
        --line: #e5e5ea;
        --gold: #a8842f;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #000000;
          --surface: #1c1c1e;
          --ink: #f5f5f7;
          --ink-2: #98989d;
          --line: #38383a;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text',
          'IBM Plex Sans Arabic', system-ui, sans-serif;
      }
      main {
        width: 100%;
        max-width: 420px;
        padding: 28px 24px;
        text-align: center;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 20px;
      }
      img { width: 72px; height: 72px; border-radius: 18px; }
      h1 { margin: 18px 0 0; font-size: 20px; }
      p { margin: 8px 0 0; font-size: 14px; color: var(--ink-2); line-height: 1.6; }
      .en { direction: ltr; }
      button {
        margin-top: 22px;
        width: 100%;
        min-height: 48px;
        border: 0;
        border-radius: 12px;
        background: var(--ink);
        color: var(--surface);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      hr { margin: 22px 0 0; border: 0; border-top: 1px solid var(--line); }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="Sufra OS" />
      <h1>لا يوجد اتصال بالإنترنت</h1>
      <p>
        سُفرة أو إس يحتاج الاتصال لفتح الوردية والطلبات. أعد الاتصال ثم حاول مرة أخرى.
      </p>
      <p class="en">Sufra OS needs a connection to open the shift and the tickets.</p>
      <button type="button" onclick="window.location.reload()">إعادة المحاولة · Try again</button>
      <hr />
      <p class="en" style="color: var(--gold); font-weight: 600">Sufra OS</p>
    </main>
  </body>
</html>
